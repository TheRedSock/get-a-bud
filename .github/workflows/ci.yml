name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # Build-time stubs — Next.js compiles server modules but does not
      # execute them during `next build`. These satisfy module-level checks.
      DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub?sslmode=require"
      NEXTAUTH_SECRET: "ci-stub-secret-not-used-at-runtime"
      NEXTAUTH_URL: "http://localhost:3000"
      FIELD_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      # next build sets NODE_ENV=production, so these become required:
      SENTRY_DSN: "https://stub@o0.ingest.sentry.io/0"
      RATE_LIMIT_PROVIDER: "noop"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Using `npm install` instead of `npm ci` because the lock file is
      # generated on Windows and may drift from Linux resolution. Acceptable
      # for a prototype; tighten to `npm ci` once lock file is stable or
      # generated in a cross-platform-safe way.
      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_DATABASE_URL: postgresql://get_a_bud:get_a_bud@localhost:5433/get_a_bud_test?sslmode=disable
      DATABASE_URL: postgresql://get_a_bud:get_a_bud@localhost:5433/get_a_bud_test?sslmode=disable
      NEXTAUTH_SECRET: test-secret-32-bytes-long-enough!!
      NEXTAUTH_URL: http://localhost:3000
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SENTRY_DSN: https://stub@o0.ingest.sentry.io/0
      RATE_LIMIT_PROVIDER: noop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Migrate test database
        run: npx drizzle-kit migrate

      - name: Integration tests
        run: npm run test:integration

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Security audit (high severity)
        run: npm audit --audit-level=high
