services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: get_a_bud
      POSTGRES_PASSWORD: get_a_bud
      POSTGRES_DB: get_a_bud_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U get_a_bud -d get_a_bud_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
